name: scandesk
description: "QR-based IT asset and ticket management app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation and dependency injection
  go_router: ^16.0.0
  get_it: ^8.0.3

  # Backend and config
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^5.2.1

  # Formatting and translations
  intl: any

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_fonts: ^9.0.0
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  image_picker: ^1.2.4
  cached_network_image: ^4.0.6
  fl_chart: ^1.3.0
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

  # Added in later sprints (see the sprint plan):
  # S3: mobile_scanner, qr_flutter, pdf, printing
  # S4: image_picker, flutter_image_compress, cached_network_image
  # S5: firebase_core, firebase_messaging, flutter_local_notifications
  # S6: drift, drift_flutter, connectivity_plus (+ drift_dev, build_runner in dev)
  # S7: fl_chart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
